
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORALE 3.2 | Winter Edition</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152f, #102e59);
      color: white;
      min-height: 100vh;
    }
    header {
      padding: 22px;
      text-align: center;
      border-bottom: 1px solid #ffffff25;
    }
    header h1 { margin: 0; color: #8edbff; }
    header p { color: #c6eaff; }
    main {
      width: min(850px, 94%);
      margin: 30px auto;
      background: #ffffff0d;
      border: 1px solid #ffffff20;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 15px 45px #0005;
    }
    #chat {
      height: 390px;
      overflow-y: auto;
      padding: 12px;
      background: #06132980;
      border-radius: 14px;
      margin-bottom: 15px;
    }
    .message {
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 14px;
      max-width: 85%;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    .user {
      background: #176bb5;
      margin-right: auto;
    }
    .bot {
      background: #17375e;
      margin-left: auto;
    }
    .controls { display: flex; gap: 10px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #ffffff30;
      border-radius: 12px;
      background: #071a35;
      color: white;
      font-size: 16px;
      outline: none;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 0 22px;
      background: #48b9ed;
      color: #06203b;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #8edbff; }
    footer {
      text-align: center;
      color: #a9cce8;
      padding: 20px;
    }
    @media (max-width: 500px) {
      .controls { flex-direction: column; }
      button { padding: 14px; }
      #chat { height: 55vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>❄️ ORALE 3.2</h1>
    <p>Winter Edition — مساعدك الرقمي</p>
  </header>

  <main>
    <h2>💬 محادثة ORALE</h2>
    <div id="chat" aria-live="polite">
      <div class="message bot">
        مرحبًا بك في ORALE 3.2! ❄️ كيف يمكنني مساعدتك؟
      </div>
    </div>

    <form class="controls" id="chatForm">
      <input id="userInput" type="text"
        placeholder="اكتب رسالتك هنا..." autocomplete="off" required>
      <button type="submit">إرسال ➤</button>
    </form>
  </main>

  <footer>ORALE 3.2 ❄️ — Your Goals. Your Focus. Your Future.</footer>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");
    const chat = document.getElementById("chat");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function getReply(text) {
      const value = text.toLowerCase();

      if (value.includes("مرحبا") || value.includes("السلام")) {
        return "أهلاً بك! ❄️ سعيد بوجودك في ORALE.";
      }
      if (value.includes("اسمك")) {
        return "أنا ORALE، مساعدك الرقمي التجريبي.";
      }
      if (value.includes("برمجة") || value.includes("كود")) {
        return "البرمجة تبدأ بخطوة صغيرة. ما المشروع الذي تريد بناءه؟";
      }
      if (value.includes("شكرا") || value.includes("شكراً")) {
        return "العفو! أنا هنا لمساعدتك.";
      }
      if (value.includes("كيف حالك")) {
        return "أنا بخير، شكرًا لسؤالك! كيف يمكنني مساعدتك؟";
      }

      return "وصلتني رسالتك! هذه نسخة تجريبية من ORALE، وإجاباتي محدودة حاليًا.";
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      setTimeout(function() {
        addMessage(getReply(text), "bot");
      }, 400);
    });
  </script>
</body>
</html>
